title: Marigold
url: https://marigold.run
baseurl: ""

description: >
  Self-hosted, open source inference platform for open-weight
  HuggingFace models. Typed async API, declarative workflow engine,
  and an eval surface, running on your own hardware.

plugins:
  - jekyll-sitemap

permalink: /:basename:output_ext

collections:
  tutorials:
    output: true
    permalink: /tutorials/:path.html

defaults:
  - scope:
      path: ""
      type: posts
    values:
      permalink: /blog/:slug.html
  - scope:
      path: ""
      type: tutorials
    values:
      layout: tutorial

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
  - dist
