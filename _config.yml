title: Marigold
url: https://marigold.run
baseurl: ""

description: >
  Self-hosted, open source LLM server and inference API for open-weight
  HuggingFace models. Applications installed from registries share one
  model cache and one worker, on your own hardware.

plugins:
  - jekyll-sitemap

permalink: /:basename:output_ext

collections:
  tutorials:
    output: true
    permalink: /tutorials/:path.html

# Head tags read these values; a page overrides any of them in front matter.
#   og_type   website | article
#   image     path of the 1200x630 social card
#   robots    e.g. "noindex"
# last_modified_at in front matter sets the sitemap lastmod.
defaults:
  - scope:
      path: ""
    values:
      og_type: website
      image: /assets/og-default.png
  - scope:
      path: ""
      type: posts
    values:
      permalink: /blog/:slug.html
      og_type: article
  - scope:
      path: ""
      type: tutorials
    values:
      layout: tutorial
      og_type: article
  # Documentation, checked out from the marigold repository at build
  # time. See .github/workflows/site.yml.
  - scope:
      path: "docs"
    values:
      layout: doc
      og_type: article
      title_suffix: " -- Marigold docs"
  # docs/README.md has front matter, so jekyll-readme-index leaves it
  # alone; this makes it the /docs/ index.
  - scope:
      path: "docs/README.md"
    values:
      permalink: /docs/
  - scope:
      path: "403.html"
    values:
      sitemap: false
      robots: noindex

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
  - dist
  - seo
  - scripts
  - _marigold
  - vendor
